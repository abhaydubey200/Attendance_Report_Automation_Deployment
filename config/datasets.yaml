# Dataset registry (PRD 5.2 / 6.1).
#
# These are LOGICAL categories only. Column definitions are intentionally empty:
# they must be filled in from inspected sample files during Phase 0/2 discovery.
# Do NOT add assumed Bizom / Pocket HRMS column names here.
#
# schema_status: PENDING_DISCOVERY -> uploads of this dataset cannot pass schema
# validation until required_columns are defined and status is DEFINED.

source_systems:
  BIZOM: Bizom
  POCKET_HRMS: Pocket HRMS
  HR: HR (manually maintained)

datasets:
  # Pocket HRMS "AttendanceSummary" export. Columns below come from the first real
  # sample (14-Nov-2026): header on row 5 after a 4-row preamble, two rows per
  # employee (in time, then out time). The reader pairs them into one record and
  # derives a factual label; HR decides what each label means (value map).
  - dataset_id: HRMS_ATTENDANCE_SUMMARY
    dataset_name: Attendance Summary (Pocket HRMS)
    source_system: POCKET_HRMS
    frequency: DAILY
    file_formats: [".xlsx", ".csv"]
    active: true
    schema_version: "1.0.0"
    schema_status: DEFINED
    required_columns: [Code, Name, Category, Date, Shift Name, In-Out Time, Type, Day, Remarks]
    optional_columns: []
    column_mappings: {}
    primary_key_columns: []
    date_column: Date
    validation_rules: []
    seed_schema:
      notes: "Seeded from the first Pocket HRMS AttendanceSummary sample. Value map is a PROPOSAL - HR must confirm it."
      definition:
        columns:
          Code: source_employee_id
          Name: source_employee_name
          Category: category
          Date: attendance_date
          Shift Name: shift_name
          In Time: first_in_time
          Out Time: last_out_time
          Punches: punch_count
          Type: leave_type
          Day: day_portion
          Derived Status: source_status
        primary_key: [source_employee_id, attendance_date]
        date_formats: ["%d/%m/%Y"]
        time_formats: ["%H:%M", "%H:%M:%S"]
        exclude_codes: []
        value_maps:
          source_status:
            PUNCH_IN_OUT: PRESENT
            PUNCH_SINGLE: MISSING_PUNCH
            LEAVE:PL: APPROVED_LEAVE
            LEAVE:SL: APPROVED_LEAVE
            # Left unmapped on purpose (HR decision -> UNRESOLVED until set):
            # NO_PUNCH, NO_PUNCH_NO_SHIFT, LEAVE:LD and any other leave code

  - dataset_id: BIZOM_ATTENDANCE
    dataset_name: Bizom Attendance
    source_system: BIZOM
    frequency: DAILY
    file_formats: [".csv", ".xlsx"]
    active: false                   # 2026-11-14: all data now comes from Pocket HRMS (kept for later)
    schema_version: "0.0.0"
    schema_status: PENDING_DISCOVERY
    required_columns: []
    optional_columns: []
    column_mappings: {}
    primary_key_columns: []
    date_column: null
    validation_rules: []

