# Application-level settings. Non-secret values only.
# Environment variables override selected keys (see .env.example).

app:
  name: "APIS Intelligent HR & Attendance MIS"
  short_name: "APIS ATTENDANCE MIS"
  timezone: "Asia/Kolkata"
  date_format: "%d-%b-%Y"          # e.g. 13-Nov-2026
  datetime_format: "%d-%b-%Y %H:%M"
  environment: development          # development | testing | production (override: APP_ENV)

storage:
  base_dir: storage                 # relative to project root unless absolute (override: APP_STORAGE_DIR)
  uploads: uploads
  raw: raw
  processed: processed
  reports: reports
  archive: archive

logging:
  dir: logs                         # override: APP_LOG_DIR
  level: INFO                       # override: APP_LOG_LEVEL
  file_name: app.log
  max_bytes: 10485760               # 10 MB per file
  backup_count: 10
  json: true

uploads:
  max_file_size_mb: 25
  allowed_extensions: [".csv", ".xlsx"]   # .json / .xls only after verification (PRD 5.3)

session:
  idle_timeout_minutes: 30
  max_failed_logins: 5
  lockout_minutes: 15
  min_password_length: 12

api:
  host: 127.0.0.1                   # bind address; production sets the server interface explicitly
  port: 8000
  cookie_name: apis_mis_session
  cookie_secure: false              # must be true in production (HTTPS) -- enforced
  cors_origins: []                  # e.g. intranet origin(s) when the UI is hosted there
  frame_ancestors: ["'self'"]       # add the intranet origin here to allow embedding in an iframe
  serve_frontend: true              # serve frontend/dist from the API (single-origin deployment)
  # Session signing key comes ONLY from env APP_SECRET_KEY (>= 32 chars; required in production).

auth:
  # none  -> no login page; every request acts as `default_user`. Allowed ONLY when the
  #          server binds to localhost and NEVER in production (enforced).
  # local -> username/password login (security.app_user).
  # A future `intranet` mode will trust the APIS intranet's sign-in (see docs/INTEGRATION.md).
  mode: none                        # override: AUTH_MODE
  default_user:
    username: local.operator
    display_name: APIS HR Operator
    roles: [HR_ADMIN, SYSTEM_ADMIN]

email:
  # outbox -> writes .eml files to storage/archive/outbox (test mode; nothing is sent).
  # smtp / graph -> real delivery; only allowed when features.email_enabled is true
  # (production only) AND recipients.yaml is APPROVED. Secrets come from env:
  # SMTP_USER, SMTP_PASSWORD, GRAPH_TENANT_ID, GRAPH_CLIENT_ID, GRAPH_CLIENT_SECRET.
  transport: outbox
  sender: null                      # e.g. hr-mis@<apis domain>, set by IT
  test_recipients: []               # in test mode every message goes only to these (or the outbox)
  smtp_host: null
  smtp_port: 587
  smtp_starttls: true
  max_attempts: 3

features:
  email_enabled: false              # must stay false outside production (PRD 24.3)
  ai_enabled: false                 # AI is optional (PRD 14)
