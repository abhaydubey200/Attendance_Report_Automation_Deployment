# APIS Daily Attendance -- defaults. Counting rules, recipients and email options
# are edited in the app (Settings screen) and saved in the database; these values
# are only the starting point. Secrets come from environment variables (.env).

app:
  name: "APIS Daily Attendance"
  short_name: "APIS ATTENDANCE"
  company: "APIS India Limited"
  timezone: "Asia/Kolkata"
  date_format: "%d-%b-%Y"           # 13-Nov-2026
  datetime_format: "%d-%b-%Y %I:%M %p"
  environment: development          # override: APP_ENV
  public_url: null                  # link to this app in emails (override: APP_PUBLIC_URL)

storage:
  base_dir: storage                 # uploaded files, reports, email outbox (override: APP_STORAGE_DIR)

logging:
  dir: logs                         # override: APP_LOG_DIR
  level: INFO
  file_name: app.log
  max_bytes: 10485760
  backup_count: 10
  json: true

uploads:
  max_file_size_mb: 25
  allowed_extensions: [".xlsx", ".csv"]

session:
  idle_timeout_minutes: 30
  max_failed_logins: 5
  lockout_minutes: 15
  min_password_length: 12

# How a day is counted (Pocket HRMS AttendanceSummary). Change in Settings.
rules:
  late_after: "09:30"               # office opens
  flexi_until: "11:00"              # latest punch-in: first punch after this = late (minutes counted from 11:00)
  early_before: "19:30"             # office closes: leaving before this without completing min_work_hours = left early
  min_work_hours: 8.0               # mandatory for everyone, counted from punch-in to punch-out; less = short hours
  long_work_hours: 11.0             # more = long hours
  on_duty_codes: [LD, OD]           # Type codes that mean working (on duty); other codes = leave
  wfh_codes: [WFH, WH]              # Type codes that mean work from home (counted present)
  no_punch_with_shift: ABSENT       # no punch, shift assigned
  no_punch_no_shift: NOT_TRACKED    # no punch, "Shift Not Assigned" (mostly field Sales)
  single_punch_counts_present: true # one punch = present, flagged as missing punch
  exclude_codes: ["^test$", "DUMMY", "^CAND-", "^A001$", "^VACANT"]   # test/dummy records (regular expressions)
  always_present_codes: [HO0034, HO0077, HO0098]
  out_of_scope_categories: [Sales]  # field sales not in the employee master: left out (separate Bizom tool)   # Directors (Amit, Prem, Vimal Anand): always counted present

jobs:                               # unattended jobs (Windows Task Scheduler) - see docs/DEPLOYMENT.md
  inbox_dir: null                   # default <storage>/inbox; override APP_INBOX_DIR. Drop the day's Pocket HRMS files here.
  permission_required: false        # 09:30 job: true = do not send until the Permission Report is in the inbox
  lock_stale_minutes: 120           # a job lock older than this is considered abandoned
  backup_keep_days: 30
  keep_months: 2                    # months of daily attendance kept in the database (older: archived, then removed)
  alert_emails: []                  # job failure alerts; empty = the HR mailbox (Settings -> Email)

email:
  mode: test                        # test = save to storage/outbox and show in app; live = send via the Gmail API
  approval_required: true           # preview mode: emails wait for Approve on the "Approve emails" screen
  auto_send: true                   # when approval is off: send right after the upload
  wait_for_permission: true         # prepare emails only once the day's Permission Report is uploaded too
  sender: null                      # one central mailbox, e.g. attendance@<company domain>
  reply_to: null
  subject_prefix: "Daily Attendance"
  attach_excel: true
  attach_dashboard: true
  retry_attempts: 3
  team_emails: true                 # Email_Routing_Config switches (imported from HR's routing workbook)
  hod_summary: true
  director_report: true
  hr_exceptions: true
  hod_cc_on_team: false             # needs HR approval
  hr_cc_on_hod_summary: false
  test_recipient: null              # TESTING ONLY: every email goes to this one address instead
  test_cc: []                       # TESTING ONLY: CC on every test email
  director_name: Director
  director_emails: []               # TBC
  hr_emails: []                     # HR attendance mailbox, TBC

api:
  host: 127.0.0.1
  port: 8000
  cookie_name: apis_mis_session
  cookie_secure: false              # true in production (HTTPS) -- enforced
  cors_origins: []
  frame_ancestors: ["'self'"]
  serve_frontend: true

auth:
  # none  -> no login page; localhost only, never production (enforced).
  # local -> username/password sign-in.
  mode: none                        # override: AUTH_MODE
  default_user:
    username: local.operator
    display_name: APIS HR Operator
    roles: [ADMIN]
