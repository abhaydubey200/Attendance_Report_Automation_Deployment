{% macro icon(name, size=22) -%}
<svg class="ic" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "check" -%}<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16.2 9.6"/>
{%- elif name == "user-x" -%}<circle cx="10" cy="8" r="4"/><path d="M3 21c0-4 3.1-6.5 7-6.5 1.4 0 2.6.3 3.7.9"/><path d="M16 15.5l5 5M21 15.5l-5 5"/>

{%- elif name == "door" -%}<path d="M13 4H6v16h7"/><path d="M10 12h10M17 9l3 3-3 3"/>

{%- elif name == "laptop" -%}<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>
{%- elif name == "briefcase" -%}<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18"/>
{%- elif name == "calendar" -%}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
{%- elif name == "help" -%}<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .9-1 1.6M12 17h.01"/>

{%- elif name == "bars" -%}<path d="M5 20V13M10 20V9M15 20V11M20 20V5"/>
{%- elif name == "chat" -%}<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/>
{%- elif name == "check-square" -%}<rect x="3.5" y="4.5" width="17" height="16" rx="2"/><path d="M8 3v3M16 3v3M8.5 13.5l2.5 2.5 4.5-5"/>
{%- elif name == "user-cog" -%}<circle cx="10" cy="8" r="4"/><path d="M3 21c0-4 3.1-6.5 7-6.5"/><circle cx="18" cy="17.5" r="2.3"/><path d="M18 13.5v1.7M18 19.8v1.7M14.5 17.5h1.2M20.3 17.5h1.2"/>

{%- elif name == "search" -%}<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
{%- elif name == "download" -%}<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>
{%- elif name == "printer" -%}<path d="M7 9V4h10v5"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v6H7z"/>
{%- endif -%}
</svg>
{%- endmacro %}
