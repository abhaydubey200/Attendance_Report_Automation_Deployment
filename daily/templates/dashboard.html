<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ title }}</title>
<style>
  :root { --honey:#f5b800; --brown:#835415; --brown-dark:#5e3c0f; --gold:#d7ad5f; --cream:#fffbf6; --cream2:#fff4e3;
          --ink:#2b2118; --muted:#6e6152; --line:#ecdfc9; --ok:#2e7d4f; --warn:#c88a00; --bad:#a52a1a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI",system-ui,-apple-system,sans-serif; color:var(--ink); background:var(--cream); }
  header { background:#fff; border-bottom:4px solid var(--honey); padding:20px 28px 16px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }
  header img.logo { width:150px; height:auto; display:block; }
  h1 { font:700 22px Georgia,serif; color:var(--brown-dark); margin:0; }
  .sub { color:var(--muted); font-size:13px; margin-top:2px; }
  main { max-width:1180px; margin:0 auto; padding:22px 24px 40px; }
  h2 { font:700 17px Georgia,serif; color:var(--brown-dark); margin:26px 0 10px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .kpi { background:#fff; border:1px solid var(--line); border-top:4px solid var(--honey); border-radius:10px; padding:10px 12px; }
  .kpi.main { border-top-color:var(--brown); }
  .kpi .l { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .kpi .v { font:700 26px Georgia,serif; color:var(--brown-dark); margin-top:2px; }
  ul.hl { list-style:none; padding:0; margin:0; display:grid; gap:6px; }
  ul.hl li { background:#fff; border:1px solid var(--line); border-left:5px solid var(--gold); border-radius:8px; padding:9px 12px; font-size:14px; }
  ul.hl li.good { border-left-color:var(--ok); } ul.hl li.warn { border-left-color:var(--warn); } ul.hl li.bad { border-left-color:var(--bad); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .card h3 { margin:0 0 6px; font-size:14px; color:var(--brown-dark); }
  svg text { font-family:"Segoe UI",sans-serif; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  .controls input, .controls select { padding:8px 10px; border:1px solid var(--line); border-radius:7px; min-width:220px; font-size:14px; }
  .chip { border:1px solid var(--gold); background:var(--cream2); color:var(--brown-dark); border-radius:999px; padding:5px 11px; font-size:12px; cursor:pointer; }
  .chip.on { background:var(--brown); color:#fff; border-color:var(--brown); }
  table { width:100%; border-collapse:collapse; background:#fff; font-size:13px; }
  th { background:var(--brown); color:#fff; text-align:left; padding:8px; position:sticky; top:0; cursor:pointer; white-space:nowrap; }
  td { padding:7px 8px; border-bottom:1px solid var(--line); }
  tr:nth-child(even) td { background:#fffdf9; }
  .tablewrap { max-height:560px; overflow:auto; border:1px solid var(--line); border-radius:10px; }
  .st { padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap; }
  .count { color:var(--muted); font-size:12px; }
  footer { color:var(--muted); font-size:12px; margin-top:26px; }
  @media print { .controls { display:none; } .tablewrap { max-height:none; } }
</style>
</head>
<body>
<header>
  <img class="logo" src="{{ logo }}" alt="apis">
  <div>
    <h1 id="title"></h1>
    <div class="sub" id="subtitle"></div>
  </div>
</header>
<main>
  <section class="kpis" id="kpis"></section>
  <h2>Highlights</h2>
  <ul class="hl" id="highlights"></ul>
  <div class="grid" style="margin-top:14px">
    <div class="card"><h3>Status breakdown</h3><div id="statusChart"></div></div>
    <div class="card"><h3>Arrival times</h3><div id="arrivalChart"></div></div>
    <div class="card" id="catCard"><h3 id="catTitle">Attendance % by category</h3><div id="catChart"></div></div>
  </div>
  <h2>Employees</h2>
  <div class="controls">
    <input id="search" placeholder="Search name or code…" aria-label="Search employees">
    <select id="group" aria-label="Filter"></select>
    <span id="filters"></span>
    <span class="count" id="count"></span>
  </div>
  <div class="tablewrap"><table id="tbl"><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
  <footer id="footer"></footer>
</main>
<script>
const D = {{ data_json | safe }};
const COLORS = {PRESENT:"#2e7d4f", MISSING_PUNCH:"#c88a00", ON_DUTY:"#3b6fb6", WFH:"#5a7fc0", HALF_DAY:"#d7ad5f", LEAVE:"#9f7b49", ABSENT:"#a52a1a", WEEK_OFF:"#6c8ea4", NOT_TRACKED:"#9a9a9a"};
const LABELS = {PRESENT:"Present", MISSING_PUNCH:"Missing punch", ON_DUTY:"On duty", WFH:"Work from home", HALF_DAY:"Half day", LEAVE:"Leave", ABSENT:"Absent", WEEK_OFF:"Week off", NOT_TRACKED:"Not tracked"};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = D.summary, C = S.counts;
document.getElementById("title").textContent = D.title;
document.getElementById("subtitle").textContent = D.subtitle;
const kpis = [["Attendance %", S.attendance_pct === null ? "–" : S.attendance_pct + "%", true], ["Employees", S.employees], ["Present", C.PRESENT],
  ["Absent", C.ABSENT], ["Late", S.late], ["Missing punch", C.MISSING_PUNCH], ["Leave", C.LEAVE + C.HALF_DAY], ["On duty", C.ON_DUTY],
  ["Left early", S.left_early], ["Avg arrival", S.avg_in_time || "–"], ["Avg hours", hm(S.avg_work_hours) || "–"], ["Week off", C.WEEK_OFF || 0], ["Not tracked", C.NOT_TRACKED]];
document.getElementById("kpis").innerHTML = kpis.map(([l, v, m]) => `<div class="kpi${m ? " main" : ""}"><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div></div>`).join("");
document.getElementById("highlights").innerHTML = D.highlights.map((h) => `<li class="${esc(h.kind)}">${esc(h.text)}</li>`).join("");

function hbars(el, items, max, unit) {
  if (!items.length) { el.innerHTML = '<p class="count">No data.</p>'; return; }
  const W = 520, rowH = 26, lw = 170, bw = W - lw - 50;
  const svg = items.map((it, i) => {
    const w = max ? Math.max(2, (it.value / max) * bw) : 0, y = i * rowH + 4;
    return `<text x="${lw - 6}" y="${y + 15}" text-anchor="end" font-size="12" fill="#2b2118">${esc(it.label)}</text>
      <rect x="${lw}" y="${y}" width="${w}" height="18" rx="4" fill="${it.color}"><title>${esc(it.label)}: ${it.value}${unit}</title></rect>
      <text x="${lw + w + 6}" y="${y + 14}" font-size="12" fill="#6e6152">${it.value}${unit}</text>`;
  }).join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${items.length * rowH + 8}" width="100%" role="img">${svg}</svg>`;
}
const statusItems = Object.keys(LABELS).filter((k) => C[k]).map((k) => ({label: LABELS[k], value: C[k], color: COLORS[k]}));
hbars(document.getElementById("statusChart"), statusItems, Math.max(...statusItems.map((x) => x.value), 1), "");
hbars(document.getElementById("arrivalChart"), D.arrivals.map((a) => ({label: a.label, value: a.count, color: "#d7ad5f"})),
      Math.max(...D.arrivals.map((a) => a.count), 1), "");
const BD = D.breakdown || {by: "Category", rows: []};
if (BD.rows.length > 1) {
  document.getElementById("catTitle").textContent = `Attendance % by ${BD.by.toLowerCase()}`;
  const short = (s) => s.length > 26 ? s.slice(0, 25) + "…" : s;
  hbars(document.getElementById("catChart"), BD.rows.filter((c) => c.attendance_pct !== null)
        .map((c) => ({label: short(c.name), value: c.attendance_pct, color: c.attendance_pct < 75 ? "#a52a1a" : c.attendance_pct < 90 ? "#c88a00" : "#2e7d4f"})), 100, "%");
} else { document.getElementById("catCard").style.display = "none"; }

// decimal hours -> "h:mm" (9.47 -> "9:28")
function hm(h) {
  if (h === null || h === undefined || h === "") return "";
  const m = Math.round(Number(h) * 60);
  return Number.isFinite(m) ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}` : String(h);
}
// 24-hour "HH:MM" -> "h:MM AM/PM" (sorting still uses the stored 24-hour value)
function t12(v) {
  const m = /^(\d{1,2}):(\d{2})/.exec(v || "");
  if (!m) return v || "";
  const h = Number(m[1]);
  return `${h % 12 || 12}:${m[2]} ${h < 12 ? "AM" : "PM"}`;
}
const hasMaster = D.rows.some((r) => r.department || r.hod);
const emailed = D.routing_columns === false;          // emailed copy: "your team" only, no department / category filter
const routingCols = D.routing_columns === false ? [] : [["hod","HOD"],["team","Team"],["manager","Reporting manager"]];
const cols = [["code","Code"],["name","Name"], ...(hasMaster ? [["department","Department"], ...routingCols] : [["category","Category"]]),
              ["status_label","Status"],["in_time","In"],["out_time","Out"],
              ["work_hours","Hours (h:mm)"],["late_minutes","Late min"],["early_minutes","Early min"],["leave_type","Leave"],["permission","Permission"]];
const groupKey = hasMaster ? "department" : "category";
const groups = [...new Set(D.rows.map((r) => r[groupKey]).filter(Boolean))].sort();
const groupSel = document.getElementById("group");
if (groups.length > 1 && !emailed) {
  groupSel.innerHTML = `<option value="">All ${hasMaster ? "departments" : "categories"}</option>` + groups.map((g) => `<option>${esc(g)}</option>`).join("");
  groupSel.addEventListener("change", render);
} else { groupSel.style.display = "none"; }
let sortKey = "name", sortDir = 1, statusFilter = "ALL";
document.getElementById("thead").innerHTML = cols.map(([k, l]) => `<th data-k="${k}">${esc(l)}</th>`).join("");
document.querySelectorAll("#thead th").forEach((th) => th.addEventListener("click", () => {
  const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; render();
}));
const filters = [["ALL", "All"], ["ABSENT", "Absent"], ["LATE", "Late"], ["MISSING_PUNCH", "Missing punch"], ["LEFT_EARLY", "Left early"],
                 ["LEAVE", "Leave / on duty / week off"], ["SHORT_HOURS", "Short hours"], ["NOT_TRACKED", "Not tracked"]];
document.getElementById("filters").innerHTML = filters.map(([k, l]) => `<button class="chip${k === "ALL" ? " on" : ""}" data-f="${k}">${esc(l)}</button>`).join(" ");
document.querySelectorAll("#filters .chip").forEach((b) => b.addEventListener("click", () => {
  statusFilter = b.dataset.f; document.querySelectorAll("#filters .chip").forEach((x) => x.classList.toggle("on", x === b)); render();
}));
document.getElementById("search").addEventListener("input", render);
function matches(r) {
  const f = statusFilter;
  if (f === "ALL") return true;
  if (f === "LEAVE") return ["LEAVE", "HALF_DAY", "ON_DUTY", "WFH", "WEEK_OFF"].includes(r.status);
  if (["LATE", "LEFT_EARLY", "SHORT_HOURS"].includes(f)) return r.flags.includes(f);
  return r.status === f;
}
function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const g = groupSel.value;
  const rows = D.rows.filter((r) => matches(r) && (!g || r[groupKey] === g) && (!q || [r.name, r.code, r.team, r.manager]
      .some((v) => String(v || "").toLowerCase().includes(q))))
    .sort((a, b) => { const x = a[sortKey] ?? "", y = b[sortKey] ?? ""; return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });
  document.getElementById("tbody").innerHTML = rows.map((r) => `<tr>${cols.map(([k]) => k === "status_label"
    ? `<td><span class="st" style="background:${COLORS[r.status]}22;color:${COLORS[r.status]}">${esc(r.status_label)}</span></td>`
    : `<td>${esc(r[k] === 0 && (k === "late_minutes" || k === "early_minutes") ? "" : (k === "in_time" || k === "out_time") ? t12(r[k]) : k === "work_hours" ? hm(r[k]) : r[k])}</td>`).join("")}</tr>`).join("");
  document.getElementById("count").textContent = `${rows.length} of ${D.rows.length} employees`;
}
render();
document.getElementById("footer").textContent = D.footer;
</script>
</body>
</html>
