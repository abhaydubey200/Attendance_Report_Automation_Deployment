[project]
name = "apis-intelligent-hr-mis"
version = "0.5.0"
description = "APIS Intelligent HR & Attendance MIS Automation Platform"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "mssql: requires a reachable SQL Server (set DB_PROFILE=mssql and DB_* env vars)",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # fastapi.testclient still imports httpx; harmless upstream deprecation notice.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
